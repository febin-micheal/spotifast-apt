name: spotifast
arch: amd64
platform: linux
version: "${VERSION}"
release: "${REVISION}"
section: sound
priority: optional
maintainer: "Febin Micheal Antony <febinmichealantony@gmail.com>"
homepage: https://github.com/crmne/spotifast
description: |
  A native Spotify client (unofficial Ubuntu 22.04 build of Spotifast).
  Built from the upstream release tag; not affiliated with Spotify.
license: MIT
contents:
  - src: src/target/release/spotifast
    dst: /usr/bin/spotifast
    file_info: {mode: 0755}
  - src: src/LICENSE
    dst: /usr/share/doc/spotifast/copyright
    file_info: {mode: 0644}
  - src: src/README.md
    dst: /usr/share/doc/spotifast/README.md
    file_info: {mode: 0644}
  - src: src/packaging/applications/spotifast.desktop
    dst: /usr/share/applications/spotifast.desktop
    file_info: {mode: 0644}
  - src: src/packaging/icons/spotifast.svg
    dst: /usr/share/icons/hicolor/scalable/apps/spotifast.svg
    file_info: {mode: 0644}
depends:
  - libc6 (>= 2.35)
  - libdbus-1-3
  - libgl1
  - libegl1
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libwayland-client0
  - libwayland-cursor0
  - libwayland-egl1
  - libx11-6
  - libx11-xcb1
  - libxcursor1
  - libxi6
  - libxrandr2
  - libasound2
  - libpulse0
  - libgcc-s1
  - libstdc++6
